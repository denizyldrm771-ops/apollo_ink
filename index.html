<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f4ed">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="screen-orientation" content="portrait">
<title>Ink Artist Studio Assistant</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;touch-action:pan-x;color:#171717}
#viewport{position:fixed;inset:0;overflow:hidden;background:#000}
#track{width:200%;height:100%;display:flex;transition:transform .34s cubic-bezier(.22,.61,.36,1)}
.page{width:50%;height:100%;flex:0 0 50%;overflow:hidden;position:relative}
.opening{display:flex;align-items:center;justify-content:center;background:#000}
.opening img{width:100%;height:100%;object-fit:contain;object-position:center;display:block;user-select:none;-webkit-user-drag:none;pointer-events:none}
.main{background:#f7f4ed;display:flex;justify-content:center}
.app-shell{width:100%;height:100%;max-width:600px;position:relative;overflow:hidden;background:#f7f4ed}
.main-content{height:100%;overflow:auto;padding:calc(env(safe-area-inset-top) + 18px) 14px calc(76px + env(safe-area-inset-bottom));scrollbar-width:none}
.main-content::-webkit-scrollbar{display:none}
.header{display:flex;align-items:flex-start;justify-content:space-between;padding:2px 4px 12px}
.greeting{font-family:Georgia,"Times New Roman",serif;font-size:28px;line-height:.98;letter-spacing:-1.4px;margin:0}
.greeting span{display:block}
.quote{font-family:Georgia,"Times New Roman",serif;font-size:10.5px;line-height:1.25;margin-top:12px;color:#292724;max-width:150px}
.date{font-size:10px;margin-top:12px;color:#45423d}
.avatar{width:40px;height:40px;border-radius:50%;background:#d7d3ca;display:grid;place-items:center;flex:0 0 auto;overflow:hidden}
.avatar svg{width:25px;height:25px;opacity:.75}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:0 4px 12px}
.stat{height:55px;border:1px solid #ded9cf;border-radius:7px;background:rgba(255,255,255,.24);display:flex;flex-direction:column;align-items:center;justify-content:center}
.stat strong{font-size:17px;line-height:1;font-weight:700;color:#171717}
.stat small{font-size:8px;margin-top:5px;color:#4b4843}
.section-head{display:flex;align-items:center;justify-content:space-between;margin:2px 5px 6px}
.section-head h2{font-size:13px;margin:0;font-weight:700;letter-spacing:-.2px}
.section-head button{border:0;background:none;padding:2px;font-size:8px;color:#5a5751}
.empty-list{border:1px solid #e1ddd4;border-radius:9px;background:rgba(255,255,255,.25);min-height:78px;display:flex;align-items:center;justify-content:center;margin:0 4px 12px}
.empty-list span{font-size:10px;color:#8a867f}
.promo{height:104px;border-radius:13px;overflow:hidden;position:relative;background:linear-gradient(135deg,#242422,#0e0e0d);margin:0 0 10px}
.promo::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 80% 35%,rgba(255,255,255,.12),transparent 38%),linear-gradient(115deg,transparent 38%,rgba(255,255,255,.07) 39%,transparent 58%);opacity:.65}
.promo-text{position:absolute;left:16px;top:27px;color:#f4f1ea;font-family:Georgia,"Times New Roman",serif;font-size:19px;line-height:1.02;z-index:2}
.promo-arrow{position:absolute;right:12px;top:34px;width:36px;height:36px;border-radius:50%;background:#f2eee6;color:#242321;display:grid;place-items:center;font-size:20px;z-index:3}
.bottom-nav{position:absolute;left:0;right:0;bottom:0;height:67px;padding:6px 16px calc(6px + env(safe-area-inset-bottom));display:grid;grid-template-columns:1fr 1fr 52px 1fr 1fr;align-items:center;background:rgba(247,244,237,.96);border-top:1px solid #ded9cf;backdrop-filter:blur(10px)}
.nav-item{border:0;background:none;color:#3d3a35;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:8px;padding:4px}
.nav-item svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav-item.active{color:#ef1c2d}
.add{width:39px;height:39px;border-radius:50%;background:#f21e2e;color:#fff;display:grid;place-items:center;box-shadow:0 3px 9px rgba(0,0,0,.18);justify-self:center;margin-top:-13px}
.add svg{width:20px;height:20px;stroke-width:2}

/* Phone: keep the application portrait even if the physical phone is rotated. */
@media (max-width:600px){
  #viewport{width:100vh;height:100vw;max-width:100vw;max-height:100vh;transform-origin:top left}
  @media (orientation:portrait){#viewport{width:100vw;height:100dvh;transform:none}}
  @media (orientation:landscape){#viewport{width:100vh;height:100vw;transform:rotate(90deg) translateY(-100%)}}
}
/* Tablet: allow either orientation without stretching the content. */
@media (min-width:601px){#viewport{width:100vw;height:100dvh}.app-shell{max-width:600px}}
</style>
</head>
<body>
<div id="viewport">
  <div id="track">
    <section class="page opening"><img src="opening-screen.jpg" alt=""></section>
    <section class="page main">
      <div class="app-shell">
        <main class="main-content">
          <header class="header">
            <div>
              <h1 class="greeting"><span>Günaydın</span><span>Deniz.</span></h1>
              <div class="quote">“Disiplin, özgürlüğün<br>başlangıcıdır.”</div>
              <div class="date">8 Eylül 2026 · Salı</div>
            </div>
            <div class="avatar" aria-hidden="true">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.2" fill="#555"/><path d="M5.8 20c.7-4.1 3-6.1 6.2-6.1s5.5 2 6.2 6.1" fill="#555"/></svg>
            </div>
          </header>

          <section class="cards" aria-label="Özet">
            <div class="stat"><strong>—</strong><small>Randevu</small></div>
            <div class="stat"><strong>—</strong><small>Bekleyen</small></div>
            <div class="stat"><strong>—</strong><small>Günlük Gelir</small></div>
          </section>

          <div class="section-head">
            <h2>Bugünün Randevuları</h2>
            <button type="button">Tümünü Gör</button>
          </div>
          <section class="empty-list"><span>Henüz randevu eklenmedi.</span></section>

          <section class="promo" aria-label="Tanıtım alanı">
            <div class="promo-text">Sanat<br>planla büyür.</div>
            <div class="promo-arrow">→</div>
          </section>
        </main>

        <nav class="bottom-nav" aria-label="Alt menü">
          <button class="nav-item active" type="button" aria-label="Ana Sayfa">
            <svg viewBox="0 0 24 24"><path d="M3 11.2 12 4l9 7.2v8.2a1.6 1.6 0 0 1-1.6 1.6H4.6A1.6 1.6 0 0 1 3 19.4z"/><path d="M9 21v-6h6v6"/></svg><span>Ana Sayfa</span>
          </button>
          <button class="nav-item" type="button" aria-label="Randevular">
            <svg viewBox="0 0 24 24"><rect x="3.5" y="5.5" width="17" height="15" rx="2"/><path d="M7 3.5v4M17 3.5v4M3.5 10h17"/></svg><span>Randevular</span>
          </button>
          <button class="nav-item add" type="button" aria-label="Yeni">
            <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          </button>
          <button class="nav-item" type="button" aria-label="Çalışmalar">
            <svg viewBox="0 0 24 24"><path d="M5 19.5 19.5 5l1.5 1.5L6.5 21H5z"/><path d="m14.5 6 3.5 3.5"/><path d="M4 5h7M4 9h5"/></svg><span>Çalışmalar</span>
          </button>
          <button class="nav-item" type="button" aria-label="Profil">
            <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c.8-4 3.1-6 7-6s6.2 2 7 6"/></svg><span>Profil</span>
          </button>
        </nav>
      </div>
    </section>
  </div>
</div>
<script>
(()=>{
  const viewport=document.getElementById('viewport');
  const track=document.getElementById('track');
  let sx=0,sy=0,tracking=false;
  const goMain=()=>track.style.transform='translate3d(-50%,0,0)';
  const goOpening=()=>track.style.transform='translate3d(0,0,0)';
  viewport.addEventListener('touchstart',e=>{
    if(!e.touches.length)return;
    sx=e.touches[0].clientX;sy=e.touches[0].clientY;tracking=true;
  },{passive:true});
  viewport.addEventListener('touchend',e=>{
    if(!tracking||!e.changedTouches.length)return;
    tracking=false;
    const dx=e.changedTouches[0].clientX-sx;
    const dy=e.changedTouches[0].clientY-sy;
    if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)) dx<0?goMain():goOpening();
  },{passive:true});
  window.addEventListener('resize',()=>{});
  window.addEventListener('orientationchange',()=>setTimeout(()=>{},100));
})();
</script>
</body>
</html>
