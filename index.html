<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
<meta name="theme-color" content="#000000" />
<title>Ink Artist — Açılış</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
  body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;touch-action:none}
  #viewport{position:fixed;inset:0;overflow:hidden;background:#000}
  #track{position:absolute;inset:0;display:flex;width:200vw;height:100%;transform:translate3d(0,0,0);transition:transform 360ms cubic-bezier(.22,.8,.2,1);will-change:transform}
  .page{position:relative;width:100vw;height:100%;flex:0 0 100vw;overflow:hidden}
  .opening{background:#000;display:flex;align-items:center;justify-content:center}
  .opening img{display:block;width:100%;height:100%;object-fit:cover;object-position:center center;user-select:none;-webkit-user-drag:none}
  .blank{background:#fff}
</style>
</head>
<body>
<div id="viewport">
  <main id="track" aria-label="Ink Artist">
    <section class="page opening" aria-label="Açılış ekranı">
      <img src="assets/opening-screen.png" alt="Ink Artist Studio Assistant açılış ekranı" draggable="false">
    </section>
    <section class="page blank" aria-label="Boş sayfa"></section>
  </main>
</div>
<script>
(() => {
  const track = document.getElementById('track');
  const viewport = document.getElementById('viewport');
  let page = 0;
  let startX = 0, startY = 0, currentX = 0, dragging = false;

  function goTo(next) {
    page = Math.max(0, Math.min(1, next));
    track.style.transform = `translate3d(${-page * 100}vw,0,0)`;
  }

  viewport.addEventListener('touchstart', e => {
    const t = e.touches[0];
    startX = currentX = t.clientX;
    startY = t.clientY;
    dragging = true;
    track.style.transition = 'none';
  }, {passive:true});

  viewport.addEventListener('touchmove', e => {
    if (!dragging) return;
    const t = e.touches[0];
    currentX = t.clientX;
    const dx = currentX - startX;
    const dy = t.clientY - startY;
    if (Math.abs(dx) > Math.abs(dy)) {
      const base = -page * window.innerWidth;
      let x = base + dx;
      const min = -window.innerWidth;
      const max = 0;
      if (x > max) x = max + (x-max)*0.22;
      if (x < min) x = min + (x-min)*0.22;
      track.style.transform = `translate3d(${x}px,0,0)`;
    }
  }, {passive:true});

  viewport.addEventListener('touchend', () => {
    if (!dragging) return;
    dragging = false;
    const dx = currentX - startX;
    track.style.transition = 'transform 360ms cubic-bezier(.22,.8,.2,1)';
    if (dx < -55) goTo(page + 1);
    else if (dx > 55) goTo(page - 1);
    else goTo(page);
  }, {passive:true});

  // Mouse / trackpad drag for desktop preview.
  viewport.addEventListener('pointerdown', e => {
    if (e.pointerType === 'touch') return;
    startX = currentX = e.clientX;
    startY = e.clientY;
    dragging = true;
    viewport.setPointerCapture?.(e.pointerId);
    track.style.transition = 'none';
  });
  viewport.addEventListener('pointermove', e => {
    if (!dragging || e.pointerType === 'touch') return;
    currentX = e.clientX;
    const dx = currentX - startX;
    const base = -page * window.innerWidth;
    let x = base + dx;
    if (x > 0) x *= .22;
    if (x < -window.innerWidth) x = -window.innerWidth + (x + window.innerWidth)*.22;
    track.style.transform = `translate3d(${x}px,0,0)`;
  });
  viewport.addEventListener('pointerup', e => {
    if (!dragging || e.pointerType === 'touch') return;
    dragging = false;
    const dx = currentX - startX;
    track.style.transition = 'transform 360ms cubic-bezier(.22,.8,.2,1)';
    if (dx < -55) goTo(page + 1);
    else if (dx > 55) goTo(page - 1);
    else goTo(page);
  });

  window.addEventListener('resize', () => goTo(page));
})();
</script>
</body>
</html>
