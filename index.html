<script>
document.addEventListener('DOMContentLoaded', function(){
  try{
    var roots=document.querySelectorAll('[class*="login"],[class*="auth"]');
    roots.forEach(function(root){
      var els=root.querySelectorAll('div,span,h1,h2');
      els.forEach(function(el){
        if(el.children.length===0 && el.textContent.trim()==='A'){
          var img=document.createElement('img');
          img.src='icon.png'; img.alt='Apollo Ink'; img.className='apollo-login-icon';
          el.replaceWith(img);
        }
      });
    });
  }catch(e){}
});
</script>


<style id="apollo-disable-login">
  #authScreen, .auth-screen, #loginScreen, .login-screen {
    display: none !important;
  }
  #app, #mainApp, .app-shell, .app {
    display: block !important;
  }
</style>
<script id="apollo-auto-enter">
  document.addEventListener('DOMContentLoaded', function () {
    try {
      document.documentElement.classList.add('apollo-auto-enter');
      var selectors = ['#authScreen','.auth-screen','#loginScreen','.login-screen'];
      selectors.forEach(function(sel){
        document.querySelectorAll(sel).forEach(function(el){ el.style.display='none'; });
      });
      var appSelectors = ['#app','#mainApp','.app-shell'];
      appSelectors.forEach(function(sel){
        document.querySelectorAll(sel).forEach(function(el){ el.style.display='block'; });
      });
    } catch(e) {}
  });
</script>


<style id="apollo-no-auth-no-cloud-gate">
  /* V18.6: Open directly to the main app. */
  #authScreen, .auth-screen, #loginScreen, .login-screen,
  #auth, .auth, [data-auth-screen] {
    display: none !important;
  }
</style>
<script id="apollo-direct-main">
(function(){
  function openMain(){
    try{
      // Hide any auth/login overlays and common cloud setup prompts.
      document.querySelectorAll(
        '#authScreen,.auth-screen,#loginScreen,.login-screen,#auth,.auth,[data-auth-screen]'
      ).forEach(function(el){ el.style.display='none'; });

      // Remove only visible startup cloud/auth blocking overlays, if present.
      document.querySelectorAll('[role="dialog"],.modal,.overlay').forEach(function(el){
        var t=(el.textContent||'').toLowerCase();
        if(t.includes('bulut yapılandırılmadı') || t.includes('cloud not configured') ||
           t.includes('giriş yap') || t.includes('login')){
          el.style.display='none';
        }
      });

      // Make the primary application shell visible.
      document.querySelectorAll('#app,#mainApp,.app-shell,.app').forEach(function(el){
        el.style.display='block';
        el.removeAttribute('aria-hidden');
      });
    }catch(e){}
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',openMain);
  else openMain();
  window.addEventListener('load',openMain);
})();
</script>

function filteredAppointments(){
 const t=today();
 return data.appointments.filter(a=>{
   if(apptTab==="pending") return a.status==="Beklemede" && (!selectedDay || a.date===selectedDay);
   if(apptTab==="past") return a.status==="Tamamlandı" || a.status==="İptal Edildi" || a.date<t;
   if(apptTab==="future") return a.date>=t && a.status!=="Tamamlandı" && a.status!=="İptal Edildi";
   if(selectedDay!==null) return a.date===selectedDay && a.status!=="Tamamlandı" && a.status!=="İptal Edildi";
   return true;
 });
}

 let base=dateObj(selectedDay||today()),y=base.getFullYear(),m=base.getMonth();

  <rect x="3.5" y="5" width="17" height="15.5" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/>

  <path d="M8 12.5h.01M12 12.5h.01M16 12.5h.01M8 16.5h.01M12 16.5h.01M16 16.5h.01" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
</svg></button>`}
  document.getElementById("modalBody").innerHTML=`<h2>Takvim</h2><div class="monthbar"><button class="iconbtn" onclick="calendarMove(-1)"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
  <rect x="3.5" y="5" width="17" height="15.5" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
  <path d="M7 3.5v4M17 3.5v4M3.8 9h16.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M8 12.5h.01M12 12.5h.01M16 12.5h.01M8 16.5h.01M12 16.5h.01M16 16.5h.01" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
</svg></button><b>${new Date(y,m,1).toLocaleDateString("tr-TR",{month:"long",year:"numeric"})}</b><button class="iconbtn" onclick="calendarMove(1)"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
  <rect x="3.5" y="5" width="17" height="15.5" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
  <path d="M7 3.5v4M17 3.5v4M3.8 9h16.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M8 12.5h.01M12 12.5h.01M16 12.5h.01M8 16.5h.01M12 16.5h.01M16 16.5h.01" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
</svg></button></div><div class="calendar">${["Pzt","Sal","Çar","Per","Cum","Cmt","Paz"].map(x=>`<div class="calhead">${x}</div>`).join("")}${cells}</div><div class="actions"><button class="secondary" onclick="closeModal()">Kapat</button></div>`;
 };
 window.calendarMove=d=>{m+=d;if(m<0){m=11;y--}if(m>11){m=0;y++}render()};
 window.calendarPick=ds=>{selectedDay=ds;closeModal();appointments()};
 render();document.getElementById("modal").classList.add("open");
}

function previewImage(input,id){const f=input.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=document.getElementById(id);im.src=r.result;im.style.display="block"};r.readAsDataURL(f)}
function previewImages(input,id){const box=document.getElementById(id);if(!box)return;box.innerHTML="";[...(input.files||[])].forEach((f,i)=>{const r=new FileReader();r.onload=()=>{box.insertAdjacentHTML("beforeend",`<div class="image-item"><img src="${r.result}" alt="Model ${i+1}"></div>`)};r.readAsDataURL(f)})}
function compressImage(file,max=1500,q=.84){return new Promise(resolve=>{const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const scale=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));c.getContext("2d").drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL("image/jpeg",q))};img.src=r.result};r.readAsDataURL(file)})}

async function saveAppointment(id){
 const name=document.getElementById("fCustomer").value.trim();if(!name)return alert("Müşteri adını gir.");
 const phone=document.getElementById("fPhone").value.trim(),instagram=document.getElementById("fInstagram").value.trim();
 let c=data.customers.find(x=>String(x.name||"").toLowerCase()===name.toLowerCase());
 if(!c){c={id:"c"+Date.now(),name,phone,instagram};data.customers.push(c)}else{c.phone=phone;c.instagram=instagram;c.name=name}
 const old=id?data.appointments.find(x=>String(x.id)===String(id)):null,files=[...(document.getElementById("aImage").files||[])];
 let images=old?.modelImages?.length?old.modelImages:(old?.modelImage?[old.modelImage]:[]);if(files.length){const added=await Promise.all(files.map(f=>compressImage(f)));images=[...images,...added]}
 let image=images[0]||"";
 const obj={id:old?.id||"a"+Date.now(),customerId:c.id,customer:name,phone,instagram,date:document.getElementById("fDate").value,time:document.getElementById("fTime").value,type:document.getElementById("fType").value,body:document.getElementById("fBody").value.trim(),style:document.getElementById("fStyle").value.trim(),modelImage:image,modelImages:images,needle:document.getElementById("fNeedle").value.trim(),price:Number(document.getElementById("fPrice").value)||0,deposit:Number(document.getElementById("fDeposit").value)||0,status:document.getElementById("fStatus").value,note:document.getElementById("fNote").value.trim()};
 if(old)Object.assign(old,obj);else data.appointments.push(obj);
 c.last=obj.date;
 syncAppointmentFinance(old?.id,obj);
 save();closeModal();setScreen("appointments");
}
function syncAppointmentFinance(oldId,a){
 const id="appt_"+a.id;
 data.finance=data.finance.filter(x=>x.linkedAppointmentId!==id);
 if(a.status==="Tamamlandı"&&Number(a.price)>0){
   const pct=Number(a.commissionPercent)||0, commission=Number(a.price)*pct/100;
   data.finance.push({id:"f"+Date.now(),linkedAppointmentId:id,type:"Gelir",amount:Number(a.price),date:a.date,category:"Dövme",note:`${a.customer} — Randevu geliri`,commissionPercent:pct});
   if(commission>0) data.finance.push({id:"f"+(Date.now()+1),linkedAppointmentId:id,type:"Gider",amount:commission,date:a.date,category:"Komisyon",note:`${pct}% komisyon — ${a.customer}`,commissionPercent:0});
 }
}
function showCommissionChoice(id){
 const a=data.appointments.find(x=>String(x.id)===String(id)); if(!a)return;
 document.getElementById("modalBody").innerHTML=`<h2>Komisyon Seç</h2><p style="color:var(--muted);margin:6px 0 16px">${esc(a.customer||"Müşteri")} · ${money(a.price||0)}</p><div class="actions" style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><button class="secondary" type="button" onclick="finishAppointmentWithCommission('${esc(a.id)}',0)">Komisyon Yok</button><button class="secondary" type="button" onclick="finishAppointmentWithCommission('${esc(a.id)}',30)">%30</button><button class="secondary" type="button" onclick="finishAppointmentWithCommission('${esc(a.id)}',50)">%50</button><button class="secondary" type="button" onclick="finishAppointmentWithCommission('${esc(a.id)}',70)">%70</button></div><div class="actions"><button class="secondary" type="button" onclick="openAppointment('${esc(a.id)}')">Vazgeç</button></div>`;

function finishAppointmentWithCommission(id,pct){
 const a=data.appointments.find(x=>String(x.id)===String(id)); if(!a)return;
 a.status="Tamamlandı"; a.commissionPercent=Number(pct)||0;
 syncAppointmentFinance(a.id,a); save(); closeModal(); appointments();
}
function setAppointmentStatus(id,status){
 const a=data.appointments.find(x=>String(x.id)===String(id)); if(!a)return;
 if(status==="Tamamlandı"){ showCommissionChoice(id); return; }

   if(!confirm("Bu randevuyu iptal etmek istediğine emin misin? Kayıt korunacak ve finans'a gelir eklenmeyecek."))return;
   a.status="İptal Edildi"; a.commissionPercent=0; syncAppointmentFinance(a.id,a); save(); closeModal(); appointments();
 }
}

function setFinanceType(t){

}
function calcCommission(){
 const type=document.getElementById("fFinanceType")?.value,amount=Number(document.getElementById("fAmount")?.value)||0,pct=Number(document.getElementById("fCommission")?.value)||0;
 const fee=amount*pct/100,net=amount-fee;const el=document.getElementById("commissionPreview");if(el)el.textContent=type==="Gelir"?`Komisyon: ${money(fee)} · Net gelir: ${money(net)}`:"";
}
function saveFinance(){
 const amount=Number(document.getElementById("fAmount").value);if(!amount||amount<=0)return alert("Geçerli bir tutar gir.");
 const type=document.getElementById("fFinanceType").value,date=document.getElementById("fFinanceDate").value,category=document.getElementById("fCategory").value.trim()||type,note=document.getElementById("fNote").value.trim(),pct=type==="Gelir"?Number(document.getElementById("fCommission").value)||0:0;
 if(type==="Gelir"&&pct>0){
   const commission=amount*pct/100;
   // Gelir brüt tutar olarak kalır; komisyon ayrı bir gider kaydıdır.
   data.finance.push({id:"f"+Date.now(),type:"Gelir",amount,date,category,note,commissionPercent:pct});
   data.finance.push({id:"f"+(Date.now()+1),type:"Gider",amount:commission,date,category:"Komisyon",note:`${pct}% komisyon — ${note}`});
 }else data.finance.push({id:"f"+Date.now(),type,amount,date,category,note,commissionPercent:0});
 save();closeModal();finance();
}
function deleteFinance(id){if(!confirm("Bu finans kaydını silmek istediğine emin misin?"))return;const x=data.finance.find(f=>String(f.id)===String(id));if(x?.linkedAppointmentId){data.finance=data.finance.filter(f=>f.linkedAppointmentId!==x.linkedAppointmentId)}else data.finance=data.finance.filter(f=>String(f.id)!==String(id));save();finance()}

let financeMonth=today().slice(0,7),compareMonth="";
function monthName(ym){const [y,m]=ym.split("-").map(Number);return new Date(y,m-1,1).toLocaleDateString("tr-TR",{month:"long",year:"numeric"})}
function monthTotals(ym){
 const rows=data.finance.filter(x=>(x.date||"").startsWith(ym));
 return {income:rows.filter(x=>x.type==="Gelir").reduce((s,x)=>s+Number(x.amount),0),expense:rows.filter(x=>x.type==="Gider").reduce((s,x)=>s+Number(x.amount),0),rows};
}
function monthBusinessTotals(ym){
 const appts=data.appointments.filter(a=>(a.date||"").startsWith(ym)&&a.status!=="İptal Edildi");
 const customerIds=new Set(appts.map(a=>String(a.customerId||a.customer||"")).filter(Boolean));
 return {appointments:appts.length,customers:customerIds.size};
}
function changeValue(cur,prev){
 const diff=cur-prev;
 if(prev===0)return diff===0?"0%":(diff>0?"Yeni":"−");
 return `${diff>=0?"+":""}${((diff/prev)*100).toFixed(0)}%`;
}
function finance(){
 const cur=monthTotals(financeMonth),net=cur.income-cur.expense;
 const prev=new Date(Number(financeMonth.slice(0,4)),Number(financeMonth.slice(5))-2,1);const prevYm=`${prev.getFullYear()}-${String(prev.getMonth()+1).padStart(2,"0")}`;
 const autoCompare=compareMonth||prevYm, cmp=monthTotals(autoCompare);
 const curBiz=monthBusinessTotals(financeMonth),cmpBiz=monthBusinessTotals(autoCompare);
 const netCmp=cmp.income-cmp.expense;
 document.getElementById("finance").innerHTML=shell("FİNANS",`
 <div class="finance-grid"><div class="finance-card"><small>Toplam Gelir · ${monthName(financeMonth)}</small><strong class="money">${money(cur.income)}</strong></div><div class="finance-card"><small>Toplam Gider · ${monthName(financeMonth)}</small><strong class="money">${money(cur.expense)}</strong></div><div class="finance-card balance"><small>Net Bakiye · ${monthName(financeMonth)}</small><strong class="money">${money(net)}</strong></div></div>
 <div class="finance-actions"><button class="primary" onclick="openForm('finance');setTimeout(()=>setFinanceType('Gelir'),0)">＋ Gelir Ekle</button><button class="secondary" onclick="openForm('finance');setTimeout(()=>setFinanceType('Gider'),0)">＋ Gider Ekle</button></div>
 <div class="card" style="padding:14px;margin-bottom:12px"><div class="field-grid"><div class="field"><label>Görüntülenen ay</label><input type="month" value="${financeMonth}" onchange="financeMonth=this.value;finance()"></div><div class="field"><label>Karşılaştır</label><input type="month" value="${autoCompare}" onchange="compareMonth=this.value;finance()"></div></div>
 <div class="compare"><div class="stat"><small>${monthName(financeMonth)} Net</small><strong>${money(net)}</strong></div><div class="stat"><small>${monthName(autoCompare)} Net</small><strong>${money(netCmp)}</strong></div><div class="stat"><small>Gelir farkı</small><strong>${money(cur.income-cmp.income)}</strong></div><div class="stat"><small>Gider farkı</small><strong>${money(cur.expense-cmp.expense)}</strong></div></div></div>
 <div class="card" style="padding:14px;margin-bottom:12px"><div class="section-head" style="margin-top:0"><h3>AYLIK İŞLETME ÖZETİ</h3></div><div class="compare"><div class="stat"><small>${monthName(financeMonth)} Müşteri</small><strong>${curBiz.customers}</strong><small>${monthName(autoCompare)}: ${cmpBiz.customers} · ${changeValue(curBiz.customers,cmpBiz.customers)}</small></div><div class="stat"><small>${monthName(financeMonth)} Randevu</small><strong>${curBiz.appointments}</strong><small>${monthName(autoCompare)}: ${cmpBiz.appointments} · ${changeValue(curBiz.appointments,cmpBiz.appointments)}</small></div><div class="stat"><small>Gelir değişimi</small><strong>${changeValue(cur.income,cmp.income)}</strong><small>${money(cur.income-cmp.income)} fark</small></div><div class="stat"><small>Net değişimi</small><strong>${changeValue(net,netCmp)}</strong><small>${money(net-netCmp)} fark</small></div></div></div>
 <div class="section-head"><h3>İŞLEMLER · ${monthName(financeMonth)}</h3><span>${cur.rows.length}</span></div>
 <div class="card">${cur.rows.length?cur.rows.slice().sort((a,b)=>(b.date||"").localeCompare(a.date||"")).map(x=>`<div class="finance-row"><div class="money-icon">${x.type==="Gelir"?"↑":"↓"}</div><div class="grow"><b>${esc(x.category||x.type)}</b><small>${esc(x.note||"")} · ${esc(x.date||"")}${x.commissionPercent?` · ${x.commissionPercent}% komisyon`:""}</small></div><div style="display:flex;align-items:center;gap:8px"><div class="amount ${x.type==="Gelir"?"in":"out"}">${x.type==="Gelir"?"+":"−"}${money(x.amount)}</div><button class="dangerBtn finance-delete" type="button" title="Bu kaydı sil" onclick="event.preventDefault();event.stopPropagation();deleteFinance('${esc(x.id)}')">${icon("trash")} Sil</button></div></div>`).join(""):``}</div>`);
}

   <button class="row clickable" type="button" style="width:100%;text-align:left" onclick="alert('Güvenlik ayarları yakında.')">${icon("profile")}<div class="customer"><b>Güvenlik</b><small>Uygulama güvenliği</small></div><span class="profile-arrow">›</span></button>
   <button class="row clickable" type="button" style="width:100%;text-align:left" onclick="alert('Uygulama ayarları')">${icon("finance")}<div class="customer"><b>Uygulama Ayarları</b><small>Apollo Ink uygulama seçenekleri</small></div><span class="profile-arrow">›</span></button>
  </div>`);

function saveProfile(){
 const f=document.getElementById("pPhoto").files?.[0],finish=image=>{data.profile.name=document.getElementById("pName").value.trim();data.profile.email=document.getElementById("pEmail").value.trim();data.profile.studio=document.getElementById("pStudio").value.trim()||"Apollo Ink";data.profile.city=document.getElementById("pCity").value.trim();if(image)data.profile.photo=image;save();closeModal();profile()};
 if(f)compressImage(f,900,.85).then(finish);else finish(data.profile.photo||"");
}
function cloudStatusText(){
 const u=window.__cloudUser;
 if(!window.__supabase) return "Bulut bağlantısı henüz yapılandırılmadı";
 return u?`Bağlı: ${u.email||"hesap"} · Senkron aktif`:`Hesabına giriş yaparak verilerini cihazlar arasında senkronla`;
}
function openCloudAccount(){
 const u=window.__cloudUser;
 const configured=!!window.__supabase;
 document.getElementById("modalBody").innerHTML=`<h2>Hesap & Bulut</h2><div class="card" style="padding:15px;margin-bottom:12px"><b>${configured?(u?"Bulut hesabın bağlı":"Bulut hesabı hazır") : "Bulut bağlantısı hazır değil"}</b><p style="color:var(--muted);margin:8px 0 0">${configured?(u?`<b>${esc(u.email||"")}</b><br>Verilerin bu hesap altında saklanır ve aynı hesapla giriş yaptığın diğer cihazlarda kullanılabilir.`:"E-posta ve şifrenle hesap oluşturabilir veya giriş yapabilirsin."):"Önce Supabase proje bilgileri config.js dosyasına eklenmeli. Bu sürümde yerel verilerin silinmez."}</p></div>${configured&&!u?`<div class="field"><label>E-posta</label><input id="cloudEmail" type="email" autocomplete="email" placeholder="ornek@mail.com"></div><div class="field"><label>Şifre</label><input id="cloudPassword" type="password" autocomplete="current-password" placeholder="En az 6 karakter"></div><div class="actions"><button class="secondary" onclick="cloudLogin()">Giriş Yap</button><button class="primary" onclick="cloudSignup()">Hesap Oluştur</button></div><div class="actions"><button class="secondary" onclick="cloudResetPassword()">Şifremi Unuttum</button><button class="secondary" onclick="closeModal()">Kapat</button></div>`:u?`<div class="actions"><button class="primary" onclick="cloudSyncNow()">${icon("download")} Şimdi Senkronla</button><button class="secondary danger" onclick="cloudLogout()">Çıkış Yap</button></div><div class="actions"><button class="secondary" onclick="closeModal()">Kapat</button></div>`:`<div class="actions"><button class="secondary" onclick="closeModal()">Kapat</button></div>`}`;

function authGate(open=true){document.getElementById("authGate").classList.toggle("open",open);document.body.style.overflow=open?"hidden":""}
function authMsg(msg){const e=document.getElementById("authError");e.textContent=msg;e.style.display=msg?"block":"none"}
function authBusy(v){document.getElementById("authLoading").style.display=v?"block":"none"}
function authFields(){return {email:document.getElementById("authEmail").value.trim(),password:document.getElementById("authPassword").value}}
async function authLogin(){if(!window.__supabase){authMsg("Bulut bağlantısı henüz yapılandırılmadı.");return}const {email,password}=authFields();if(!email||!password){authMsg("E-posta ve şifreyi gir.");return}authBusy(true);authMsg("");const {data:res,error}=await window.__supabase.auth.signInWithPassword({email,password});authBusy(false);if(error){authMsg(error.message);return}window.__cloudUser=res.user;await cloudLoad(false);authGate(false);profile();home()}
async function authSignup(){if(!window.__supabase){authMsg("Bulut bağlantısı henüz yapılandırılmadı.");return}const {email,password}=authFields();if(!email||password.length<6){authMsg("Geçerli bir e-posta ve en az 6 karakterlik şifre gir. Şifre en az 6 karakter olmalı.");return}authBusy(true);authMsg("");const {data:res,error}=await window.__supabase.auth.signUp({email,password});authBusy(false);if(error){authMsg(error.message);return}if(res.session){window.__cloudUser=res.user;await cloudLoad(false);authGate(false);profile();home()}else{authMsg("Hesap oluşturuldu. E-posta doğrulama bağlantısı geldiyse önce e-postanı doğrula, sonra giriş yap.")}}
async function authReset(){if(!window.__supabase){authMsg("Bulut bağlantısı henüz yapılandırılmadı.");return}const email=document.getElementById("authEmail").value.trim();if(!email){authMsg("Şifre yenileme bağlantısı için önce e-posta adresini yaz.");return}authBusy(true);authMsg("");const {error}=await window.__supabase.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});authBusy(false);if(error){authMsg(error.message);return}authMsg("Şifre yenileme bağlantısı e-posta adresine gönderildi.")}

async function cloudLogin(){
 const email=document.getElementById("cloudEmail").value.trim(),password=document.getElementById("cloudPassword").value;if(!email||!password){alert("E-posta ve şifreyi gir.");return}
 const {data:res,error}=await window.__supabase.auth.signInWithPassword({email,password});if(error){alert(error.message);return}window.__cloudUser=res.user;await cloudLoad(true);closeModal();profile();
}
async function cloudSignup(){
 const email=document.getElementById("cloudEmail").value.trim(),password=document.getElementById("cloudPassword").value;if(!email||password.length<6){alert("Geçerli bir e-posta ve en az 6 karakterlik şifre gir.");return}
 const {data:res,error}=await window.__supabase.auth.signUp({email,password});if(error){alert(error.message);return}
 if(res.session){window.__cloudUser=res.user;await cloudSaveNow();closeModal();profile();alert("Bulut hesabın oluşturuldu ve bağlandı.")}else{alert("Hesap oluşturuldu. E-posta doğrulaması açıksa gelen kutunu kontrol edip sonra giriş yap.");}
}
async function cloudResetPassword(){
 const email=document.getElementById("cloudEmail").value.trim();if(!email){alert("Önce e-posta adresini yaz.");return}
 const {error}=await window.__supabase.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});if(error)alert(error.message);else alert("Şifre yenileme bağlantısı e-posta adresine gönderildi.");
}
async function cloudLogout(){await window.__supabase.auth.signOut();window.__cloudUser=null;closeModal();profile()}
let cloudSaveTimer=null;
function queueCloudSave(){if(!window.__supabase||!window.__cloudUser)return;clearTimeout(cloudSaveTimer);cloudSaveTimer=setTimeout(()=>cloudSaveNow(),900);}
async function cloudSaveNow(){if(!window.__supabase||!window.__cloudUser)return;const payload=JSON.parse(JSON.stringify(data));const {error}=await window.__supabase.from("apollo_cloud").upsert({user_id:window.__cloudUser.id,payload,updated_at:new Date().toISOString()});if(error)console.warn("Cloud save",error.message);}
async function cloudLoad(showAlert=false){if(!window.__supabase||!window.__cloudUser)return;const {data:row,error}=await window.__supabase.from("apollo_cloud").select("payload").eq("user_id",window.__cloudUser.id).maybeSingle();if(error){console.warn("Cloud load",error.message);if(showAlert)alert(error.message);return}if(row?.payload){data.appointments=Array.isArray(row.payload.appointments)?row.payload.appointments:[];data.customers=Array.isArray(row.payload.customers)?row.payload.customers:[];data.designs=Array.isArray(row.payload.designs)?row.payload.designs:[];data.finance=Array.isArray(row.payload.finance)?row.payload.finance:[];data.profile={...data.profile,...(row.payload.profile||{})};data.settings={...data.settings,...(row.payload.settings||{}),theme:"dark"};migrateLegacy();localStorage.setItem(KEY,JSON.stringify(data));renderScreen(document.querySelector(".screen.active")?.id||"home");if(showAlert)alert("Buluttaki verilerin yüklendi.");}else{await cloudSaveNow();if(showAlert)alert("Bu hesap için bulutta kayıt bulunamadı. Mevcut cihaz verilerin yüklendi.");}}
async function cloudSyncNow(){await cloudSaveNow();await cloudLoad(true)}
function initCloud(){if(!window.__supabase){authGate(true);authMsg("Bulut bağlantısı henüz yapılandırılmadı. Önce Supabase proje bilgilerini config.js dosyasına eklemeliyiz.");return}window.__supabase.auth.getSession().then(async({data:{session}})=>{if(session?.user){window.__cloudUser=session.user;authGate(false);await cloudLoad(false);profile()}else{window.__cloudUser=null;authGate(true)}});window.__supabase.auth.onAuthStateChange((_e,session)=>{window.__cloudUser=session?.user||null;if(session?.user){authGate(false);profile()}else{authGate(true);profile()}});}
function toggleTheme(){data.settings.theme="dark";applyTheme();save();profile()}
function applyTheme(){data.settings.theme="dark";document.documentElement.classList.remove("light");document.body.classList.remove("light");document.querySelector('meta[name="theme-color"]').setAttribute("content","#09090b")}
async function requestNotifications(){
 try{
  if(!("Notification" in window)){data.settings.notifications=true;save();openNotifications();return}
  const p=await Notification.requestPermission();
  data.settings.notifications=p==="granted";save();profile();
  if(p==="granted"){
   if("serviceWorker" in navigator){const reg=await navigator.serviceWorker.ready; if(reg.showNotification) await reg.showNotification("Apollo Ink",{body:"Bildirimler etkinleştirildi.",icon:"icon.png",badge:"icon.png"});}
   else new Notification("Apollo Ink",{body:"Bildirimler etkinleştirildi."});
  } else if(p==="denied") alert("Bildirim izni kapalı. iPhone'da Ayarlar > Bildirimler veya Safari/Web Sitesi ayarlarından Apollo Ink bildirimlerini açmalısın.");
 }catch(e){alert("Bildirim izni alınamadı. Uygulama içi bildirimler yine çalışır.")}
}
function openNotifications(){
 const t=today(),tom=new Date();tom.setDate(tom.getDate()+1);const ts=tom.toISOString().slice(0,10);
 const td=data.appointments.filter(a=>a.date===t&&a.status!=="İptal Edildi"),tm=data.appointments.filter(a=>a.date===ts&&a.status!=="İptal Edildi");
 document.getElementById("modalBody").innerHTML=`<h2>Bildirimler</h2><div class="card" style="padding:14px"><b>Bugün</b><p style="color:var(--muted)">${td.length} randevun var.</p><b>Yarın</b><p style="color:var(--muted)">${tm.length} randevun var.</p><b>1 saat önce</b><p style="color:var(--muted)">Yaklaşan randevular için 1 saatlik bildirim kontrolü etkin.</p></div><div class="notice">Safari/GitHub Pages üzerinde arka planda tam zamanlı zamanlayıcı garantisi yoktur. Uygulama açıkken 1 saatlik kontrol çalışır; sistem bildirimleri için izin verilmelidir.</div><div class="actions"><button class="secondary" onclick="requestNotifications()">Bildirim İzni</button><button class="secondary" onclick="closeModal()">Kapat</button></div>`;
 document.getElementById("modal").classList.add("open");
}
async function sendSystemNotification(title,body){
 try{if("serviceWorker" in navigator){const reg=await navigator.serviceWorker.ready;if(reg.showNotification){await reg.showNotification(title,{body,icon:"icon.png",badge:"icon.png"});return}}if("Notification" in window&&Notification.permission==="granted")new Notification(title,{body})}catch(e){}
}
function checkReminders(){
 const now=new Date(),stamp=Math.floor(now.getTime()/60000);
 data.appointments.forEach(a=>{if(!a.date||!a.time||a.status==="İptal Edildi")return;const dt=new Date(a.date+"T"+a.time),diff=Math.round((dt-now)/60000);if(diff>=59&&diff<=61){const key="rem_"+a.id+"_"+stamp;if(!sessionStorage.getItem(key)){sessionStorage.setItem(key,"1");if(data.settings.notifications)sendSystemNotification("Apollo Ink — 1 saat kaldı",`${a.customer} · ${a.time} · ${a.style||a.type||"Dövme"}`)}}});
}
function closeModal(){document.getElementById("modal").classList.remove("open")}
document.getElementById("modal").onclick=e=>{if(e.target.id==="modal")closeModal()};
document.getElementById("topAction").innerHTML=icon("calendar");document.getElementById("topAction").onclick=openCalendar;
document.getElementById("notificationAction").innerHTML=icon("bell");document.getElementById("notificationAction").onclick=openNotifications;
document.getElementById("fab").onclick=()=>{const s=document.querySelector(".screen.active")?.id;openForm(s==="customers"?"customer":s==="designs"?"design":s==="finance"?"finance":"appointment")};
applyTheme();home();initCloud();setInterval(checkReminders,60000);checkReminders();
