<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="screen-orientation" content="portrait">
<title>Ink Artist Studio Assistant</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;touch-action:pan-x}
#viewport{position:fixed;inset:0;overflow:hidden;background:#000}
#track{width:200%;height:100%;display:flex;transition:transform .34s cubic-bezier(.22,.61,.36,1)}
.page{width:50%;height:100%;flex:0 0 50%;overflow:hidden;position:relative}
.opening{display:flex;align-items:center;justify-content:center;background:#000}
.opening img{width:100%;height:100%;object-fit:contain;object-position:center;display:block;user-select:none;-webkit-user-drag:none;pointer-events:none}
.blank{background:#fff}

/* Phone: the app remains portrait even when the physical phone is rotated. */
@media (max-width:600px){
  #viewport{
    width:100vh;
    height:100vw;
    max-width:100vw;
    max-height:100vh;
    transform-origin:top left;
  }
  @media (orientation:portrait){
    #viewport{width:100vw;height:100dvh;transform:none}
  }
  @media (orientation:landscape){
    #viewport{
      width:100vh;
      height:100vw;
      transform:rotate(90deg) translateY(-100%);
    }
  }
}

/* Tablet: adapt to either orientation without stretching the artwork. */
@media (min-width:601px){
  #viewport{width:100vw;height:100dvh}
  .opening img{
    width:100%;height:100%;
    object-fit:contain;
  }
}
</style>
</head>
<body>
<div id="viewport">
  <div id="track">
    <section class="page opening"><img src="opening-screen.jpg" alt=""></section>
    <section class="page blank"></section>
  </div>
</div>
<script>
(()=>{
  const v=document.getElementById('viewport'), t=document.getElementById('track');
  let sx=0,sy=0,tracking=false;
  const go=(blank)=>t.style.transform=blank?'translate3d(-50%,0,0)':'translate3d(0,0,0)';
  v.addEventListener('touchstart',e=>{
    if(!e.touches.length)return;
    sx=e.touches[0].clientX;sy=e.touches[0].clientY;tracking=true;
  },{passive:true});
  v.addEventListener('touchend',e=>{
    if(!tracking||!e.changedTouches.length)return;
    tracking=false;
    const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
    if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy))go(dx<0);
  },{passive:true});
  window.addEventListener('resize',()=>{go(false)});
  window.addEventListener('orientationchange',()=>setTimeout(()=>go(false),100));
})();
</script>
</body>
</html>
