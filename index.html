<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Ink Artist Studio Assistant</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
  body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;touch-action:pan-x}
  .viewport{width:100vw;height:100dvh;overflow:hidden;position:relative}
  .track{
    width:200vw;height:100%;display:flex;
    transform:translate3d(0,0,0);
    transition:transform .32s cubic-bezier(.22,.61,.36,1);
    will-change:transform;
  }
  .page{width:100vw;height:100%;flex:0 0 100vw;position:relative;overflow:hidden}
  .opening{
    background:#000;
    display:flex;align-items:center;justify-content:center;
  }
  .opening img{
    display:block;
    width:100%;height:100%;
    object-fit:cover;
    object-position:center;
    user-select:none;-webkit-user-drag:none;
  }
  .blank{background:#fff}
</style>
</head>
<body>
<div class="viewport" id="viewport">
  <div class="track" id="track">
    <section class="page opening">
      <img src="opening-screen.jpg" alt="">
    </section>
    <section class="page blank" aria-label="Boş sayfa"></section>
  </div>
</div>
<script>
(() => {
  const track=document.getElementById('track');
  let startX=0,startY=0,active=false;
  function goBlank(){track.style.transform='translate3d(-100vw,0,0)'}
  function goOpening(){track.style.transform='translate3d(0,0,0)'}
  document.getElementById('viewport').addEventListener('touchstart',e=>{
    if(!e.touches.length)return;
    startX=e.touches[0].clientX; startY=e.touches[0].clientY; active=true;
  },{passive:true});
  document.getElementById('viewport').addEventListener('touchend',e=>{
    if(!active||!e.changedTouches.length)return;
    active=false;
    const dx=e.changedTouches[0].clientX-startX;
    const dy=e.changedTouches[0].clientY-startY;
    if(Math.abs(dx)<50 || Math.abs(dx)<Math.abs(dy))return;
    if(dx<0) goBlank(); else goOpening();
  },{passive:true});
})();
</script>
</body>
</html>
