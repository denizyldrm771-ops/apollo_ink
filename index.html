function go(n){page=Math.max(0,Math.min(1,n));track.style.transition='transform .38s cubic-bezier(.22,.8,.2,1)';track.style.transform=`translate3d(${-page*100}vw,0,0)`;}
app.addEventListener('touchstart',e=>{let t=e.touches[0];sx=cx=t.clientX;sy=t.clientY;drag=true;track.style.transition='none'},{passive:true});
app.addEventListener('touchmove',e=>{if(!drag)return;let t=e.touches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.abs(dx)<=Math.abs(dy))return;let x=-page*innerWidth+dx;if(x>0)x*=.18;if(x<-innerWidth)x=-innerWidth+(x+innerWidth)*.18;track.style.transform=`translate3d(${x}px,0,0)`;cx=t.clientX},{passive:true});
app.addEventListener('touchend',()=>{if(!drag)return;drag=false;let dx=cx-sx;if(dx<-60)go(page+1);else if(dx>60)go(page-1);else go(page)});
let ps=false;app.addEventListener('pointerdown',e=>{if(e.pointerType==='touch')return;ps=true;sx=cx=e.clientX;track.style.transition='none';app.setPointerCapture?.(e.pointerId)});app.addEventListener('pointermove',e=>{if(!ps)return;cx=e.clientX;let dx=cx-sx,x=-page*innerWidth+dx;if(x>0)x*=.18;if(x<-innerWidth)x=-innerWidth+(x+innerWidth)*.18;track.style.transform=`translate3d(${x}px,0,0)`});app.addEventListener('pointerup',()=>{if(!ps)return;ps=false;let dx=cx-sx;if(dx<-60)go(page+1);else if(dx>60)go(page-1);else go(page)});
</script></body></html>
